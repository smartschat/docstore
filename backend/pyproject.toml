[project]
name = "docstore"
version = "0.1.0"
description = "Document digitization system with OCR and semantic search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.1",
    "ocrmypdf>=16.0.0",
    "watchdog>=4.0.0",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "python-magic>=0.4.27",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "reportlab>=4.4.9",
    "onnxruntime>=1.23.2",
    "tokenizers>=0.22.2",
    "huggingface-hub>=1.3.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "freezegun>=1.2.0",
    "httpx>=0.26.0",
    "ruff>=0.6.8",
    "pytest-cov>=7.0.0",
    "pre-commit>=4.5.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "performance: marks tests as performance tests",
    "integration: marks tests as integration tests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# SQL strings and long expressions are more readable on single lines
"app/database.py" = ["E501"]
"app/main.py" = ["E501"]
"app/routers/*.py" = ["E501"]
"app/services/*.py" = ["E501"]
