[project]
name = "docstore"
version = "0.1.0"
description = "Document digitization system with OCR and semantic search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "sqlite-vec>=0.1.1",
    "ocrmypdf>=16.0.0",
    "watchdog>=4.0.0",
    "openai>=1.10.0",
    "httpx>=0.26.0",
    "pillow>=10.2.0",
    "python-magic>=0.4.27",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "reportlab>=4.4.9",
    "onnxruntime>=1.23.2",
    "tokenizers>=0.22.2",
    "huggingface-hub>=1.3.3",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
